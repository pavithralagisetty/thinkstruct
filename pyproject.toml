[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-search"
version = "0.1.0"
description = "Search engine over patent claims"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3,<6",
    "transformers>=4.44,<5",
    "einops",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patent_search = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
